# TURN da Babel — plano B universal de mídia para o PABX WebRTC.
# O relay SÓ pode entregar pacotes ao próprio Asterisk (allowed-peer-ip):
# a credencial vive no bundle público do app, e é esta trava que impede
# qualquer uso do relay fora das nossas ligações.
# Espelho de /etc/turnserver.conf na VPS (senha real só lá e no Vercel).
listening-port=3478
tls-listening-port=5349
listening-ip=143.95.216.197
relay-ip=143.95.216.197
external-ip=143.95.216.197
min-port=49152
max-port=65535
realm=pabx.babel-os.com
server-name=pabx.babel-os.com
fingerprint
lt-cred-mech
user=babelfone:<segredo — ver /etc/turnserver.conf na VPS>
cert=/etc/coturn/certs/pabx.crt
pkey=/etc/coturn/certs/pabx.key
no-tlsv1
no-tlsv1_1
no-cli
no-multicast-peers
# nega tudo…
denied-peer-ip=0.0.0.0-255.255.255.255
# …e reabre só o Asterisk (mesma máquina, IP público)
allowed-peer-ip=143.95.216.197
total-quota=120
user-quota=60
log-file=/var/log/turnserver/turnserver.log
simple-log
