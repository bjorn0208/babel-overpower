protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/pabx.crt
priv_key_file=/etc/asterisk/keys/pabx.key

;=== TRONCO BR-DID (11) 5286-3430 — linha oficial ===
[brdid-auth]
type=auth
auth_type=userpass
username=1152863430
password=bmMoJ

[brdid-aor]
type=aor
contact=sip:voz.sobreip.com.br:5060
qualify_frequency=30
qualify_timeout=4.0

[brdid]
type=endpoint
transport=transport-udp
context=de-brdid
disallow=all
allow=ulaw
allow=alaw
outbound_auth=brdid-auth
aors=brdid-aor
from_user=1152863430
from_domain=voz.sobreip.com.br
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[brdid-identify]
type=identify
endpoint=brdid
match=voz.sobreip.com.br
match=52.67.163.135

[brdid-reg]
type=registration
outbound_auth=brdid-auth
server_uri=sip:voz.sobreip.com.br:5060
client_uri=sip:1152863430@voz.sobreip.com.br
retry_interval=30
forbidden_retry_interval=300
fatal_retry_interval=30
max_retries=10000
auth_rejection_permanent=no
expiration=600
transport=transport-udp
line=yes
endpoint=brdid

;=== TRONCO BR-DID 2 — (11) 5194-0177 · adicionado em 03/08/2026 ===
; Segunda linha de saída. O dialplan alterna entre brdid e brdid2 para
; sempre haver canal livre (cada número tem 2 canais).
[brdid2-auth]
type=auth
auth_type=userpass
username=1151940177
password=C9FsI

[brdid2-aor]
type=aor
contact=sip:voz.sobreip.com.br:5060
qualify_frequency=30
qualify_timeout=4.0

[brdid2]
type=endpoint
transport=transport-udp
context=de-brdid
disallow=all
allow=ulaw
allow=alaw
outbound_auth=brdid2-auth
aors=brdid2-aor
from_user=1151940177
from_domain=voz.sobreip.com.br
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Sem bloco [identify] aqui de propósito: as duas contas ficam no MESMO
; servidor/IP e o identify do brdid já casa esse endereço — um segundo
; match duplicado faria o Asterisk recusar a config. Quem separa as
; chamadas que chegam é o line=yes da registration abaixo.
[brdid2-reg]
type=registration
outbound_auth=brdid2-auth
server_uri=sip:voz.sobreip.com.br:5060
client_uri=sip:1151940177@voz.sobreip.com.br
retry_interval=30
forbidden_retry_interval=300
fatal_retry_interval=30
max_retries=10000
auth_rejection_permanent=no
expiration=600
transport=transport-udp
line=yes
endpoint=brdid2

