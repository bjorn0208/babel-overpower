; PABX Babel Comercial — dialplan (2026-07-21; 4 linhas desde 04/08/2026)
; Entrada e saída por QUATRO linhas BR-DID, com gravação de tudo:
;   linha1 = (11) 5286-3430 · tronco brdid  · 2 canais
;   linha2 = (11) 5194-0177 · tronco brdid2 · 2 canais
;   linha3 = (11) 4863-6977 · tronco brdid3 · 2 canais
;   linha4 = (11) 5217-0714 · tronco brdid4 · 2 canais

[globals]
; GRUPO_VENDAS é redefinido pelo provisionador em extensions_ramais.conf
GRUPO_VENDAS=PJSIP/1001

; Quantos canais simultâneos CADA linha aguenta (contratado na BR-DID).
; Ao comprar mais canais para um número, suba aqui e no painel.
CANAIS_POR_LINHA=2

; O teto GERAL de saída é controlado pelo painel (Gestão → Linhas simultâneas),
; que o provisionador grava em LIMITE_SIMULTANEAS. Com 4 linhas x 2 canais,
; o teto útil é 8 — acima disso barra antes de sair.
; (PABX Virtual/BR Talk foi cancelado em 01/08.)

#include extensions_ramais.conf

[de-brdid]
; Chamada entrando pela linha BR-DID
exten => s,1,NoOp(Entrada BR-DID de ${CALLERID(num)})
 same => n,Set(__BABEL_DIR=entrada)
 same => n,Set(__BABEL_NUM=${CALLERID(num)})
 same => n,Set(CHANNEL(hangup_handler_push)=fim-chamada,s,1)
 ; Entrada: r() = voz de quem ligou (lead); t() = voz do vendedor que atendeu.
 same => n,MixMonitor(/var/spool/babel/gravacoes/${UNIQUEID}.wav,br(/var/spool/babel/gravacoes/${UNIQUEID}-lead.wav)t(/var/spool/babel/gravacoes/${UNIQUEID}-vend.wav))
 same => n,Dial(${GRUPO_VENDAS},30,rt)
 same => n,Hangup()
exten => 1152863430,1,Goto(s,1)
exten => 1151940177,1,Goto(s,1)
exten => 1148636977,1,Goto(s,1)
exten => 1152170714,1,Goto(s,1)
exten => _X!,1,Goto(s,1)

[discagem-interna]
; Ramal chamando outro ramal
exten => _10XX,1,NoOp(Chamada interna para ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,rt)
 same => n,Hangup()
; Vendedor discando para fora pela BR-DID.
; A operadora EXIGE E.164 completo (55 + DDD + número). Normalizamos por tamanho:
;  - só dígitos; remove 0 de operadora à esquerda
;  - 10-11 dígitos (nacional) -> prefixa 55
;  - 12-13 dígitos -> já está em E.164, mantém como está
; (usar tamanho, não prefixo "55", evita confundir com o DDD 55 de Santa Maria/RS)
exten => _X.,1,NoOp(Saída bruta de ${CHANNEL(endpoint)} para ${EXTEN})
 same => n,Set(GROUP()=saida)
 same => n,Set(LIMITE=${IF($["${LIMITE_SIMULTANEAS}"=""]?15:${LIMITE_SIMULTANEAS})})
 same => n,GotoIf($[${GROUP_COUNT(saida)} > ${LIMITE}]?limite)
 same => n,Set(NUM=${FILTER(0-9,${EXTEN})})
 same => n,Set(NUM=${IF($["${NUM:0:1}"="0"]?${NUM:1}:${NUM})})
 same => n,Set(NUM=${IF($[${LEN(${NUM})} <= 11]?55${NUM}:${NUM})})
 same => n,NoOp(Discando E.164 ${NUM})
 ; --- escolha da linha de saída ---
 ; Sai pela linha menos ocupada; se as duas estiverem iguais, alterna. Isso
 ; mantém sempre um canal livre e distribui o volume entre os dois números,
 ; em vez de queimar um só (operadoras marcam número que liga demais).
 same => n,Set(__BABEL_DIR=saida)
 same => n,Set(__BABEL_NUM=${NUM})
 same => n,Set(__BABEL_RAMAL=${CHANNEL(endpoint)})
 same => n,Set(CHANNEL(hangup_handler_push)=fim-chamada,s,1)
 ; Grava 3 arquivos: o mix (para ouvir) + cada lado separado (para saber QUEM
 ; falou na transcrição). r() = áudio que chega do vendedor; t() = o que é
 ; enviado a ele, ou seja, a voz do lead.
 same => n,MixMonitor(/var/spool/babel/gravacoes/${UNIQUEID}.wav,br(/var/spool/babel/gravacoes/${UNIQUEID}-vend.wav)t(/var/spool/babel/gravacoes/${UNIQUEID}-lead.wav))
 same => n,System(echo ${BABEL_RAMAL} > /var/spool/babel/aovivo/${UNIQUEID})
 ; ─── escolha de linha com FAILOVER (04/08/2026; linhas 3 e 4 no mesmo dia) ───
 ; Só disputa linha VIVA (qualify) e com canal livre; menor uso vence e o
 ; empate roda a vez 1→2→3→4. Se a escolhida falhar na hora H
 ; (CHANUNAVAIL/CONGESTION), volta e tenta outra antes de desistir.
 same => n,Set(TENTOU1=0)
 same => n,Set(TENTOU2=0)
 same => n,Set(TENTOU3=0)
 same => n,Set(TENTOU4=0)
 same => n(escolher),Set(USO1=${GROUP_COUNT(linha1@tronco)})
 same => n,Set(USO2=${GROUP_COUNT(linha2@tronco)})
 same => n,Set(USO3=${GROUP_COUNT(linha3@tronco)})
 same => n,Set(USO4=${GROUP_COUNT(linha4@tronco)})
 same => n,Set(VIVA1=${IF($[${TENTOU1} | ${USO1} >= ${CANAIS_POR_LINHA} | "${DEVICE_STATE(PJSIP/brdid)}"="UNAVAILABLE" | "${DEVICE_STATE(PJSIP/brdid)}"="INVALID"]?0:1)})
 same => n,Set(VIVA2=${IF($[${TENTOU2} | ${USO2} >= ${CANAIS_POR_LINHA} | "${DEVICE_STATE(PJSIP/brdid2)}"="UNAVAILABLE" | "${DEVICE_STATE(PJSIP/brdid2)}"="INVALID"]?0:1)})
 same => n,Set(VIVA3=${IF($[${TENTOU3} | ${USO3} >= ${CANAIS_POR_LINHA} | "${DEVICE_STATE(PJSIP/brdid3)}"="UNAVAILABLE" | "${DEVICE_STATE(PJSIP/brdid3)}"="INVALID"]?0:1)})
 same => n,Set(VIVA4=${IF($[${TENTOU4} | ${USO4} >= ${CANAIS_POR_LINHA} | "${DEVICE_STATE(PJSIP/brdid4)}"="UNAVAILABLE" | "${DEVICE_STATE(PJSIP/brdid4)}"="INVALID"]?0:1)})
 same => n,NoOp(Linhas: 3430 viva=${VIVA1} uso=${USO1} · 0177 viva=${VIVA2} uso=${USO2} · 6977 viva=${VIVA3} uso=${USO3} · 0714 viva=${VIVA4} uso=${USO4})
 same => n,GotoIf($[${VIVA1} + ${VIVA2} + ${VIVA3} + ${VIVA4} = 0]?limite)
 ; menor uso entre as vivas (uso de linha morta vira 99 para sair da disputa)
 same => n,Set(C1=${IF($[${VIVA1}]?${USO1}:99)})
 same => n,Set(C2=${IF($[${VIVA2}]?${USO2}:99)})
 same => n,Set(C3=${IF($[${VIVA3}]?${USO3}:99)})
 same => n,Set(C4=${IF($[${VIVA4}]?${USO4}:99)})
 same => n,GotoIf($[${C1} < ${C2} & ${C1} < ${C3} & ${C1} < ${C4}]?l1)
 same => n,GotoIf($[${C2} < ${C1} & ${C2} < ${C3} & ${C2} < ${C4}]?l2)
 same => n,GotoIf($[${C3} < ${C1} & ${C3} < ${C2} & ${C3} < ${C4}]?l3)
 same => n,GotoIf($[${C4} < ${C1} & ${C4} < ${C2} & ${C4} < ${C3}]?l4)
 ; empate: roda a vez, pulando linha que não disputa
 same => n,Set(VEZ=${IF($["${DB(babel/vez_linha)}"=""]?1:${DB(babel/vez_linha)})})
 same => n,Set(DB(babel/vez_linha)=${IF($["${VEZ}"="1"]?2:${IF($["${VEZ}"="2"]?3:${IF($["${VEZ}"="3"]?4:1)})})})
 same => n,GotoIf($["${VEZ}"="1" & ${VIVA1}]?l1)
 same => n,GotoIf($["${VEZ}"="2" & ${VIVA2}]?l2)
 same => n,GotoIf($["${VEZ}"="3" & ${VIVA3}]?l3)
 same => n,GotoIf($["${VEZ}"="4" & ${VIVA4}]?l4)
 same => n,GotoIf($[${VIVA1}]?l1)
 same => n,GotoIf($[${VIVA2}]?l2)
 same => n,GotoIf($[${VIVA3}]?l3)
 same => n,Goto(l4)
 ; entra no grupo e confere de novo já contando a si mesma (evita corrida
 ; entre duas chamadas que leram o contador no mesmo instante)
 same => n(l1),Set(TENTOU1=1)
 same => n,Set(GROUP(tronco)=linha1)
 same => n,GotoIf($[${GROUP_COUNT(linha1@tronco)} > ${CANAIS_POR_LINHA}]?escolher)
 same => n,Set(TRONCO=brdid)
 same => n,Set(MEUNUM=1152863430)
 same => n,Goto(disca)
 same => n(l2),Set(TENTOU2=1)
 same => n,Set(GROUP(tronco)=linha2)
 same => n,GotoIf($[${GROUP_COUNT(linha2@tronco)} > ${CANAIS_POR_LINHA}]?escolher)
 same => n,Set(TRONCO=brdid2)
 same => n,Set(MEUNUM=1151940177)
 same => n,Goto(disca)
 same => n(l3),Set(TENTOU3=1)
 same => n,Set(GROUP(tronco)=linha3)
 same => n,GotoIf($[${GROUP_COUNT(linha3@tronco)} > ${CANAIS_POR_LINHA}]?escolher)
 same => n,Set(TRONCO=brdid3)
 same => n,Set(MEUNUM=1148636977)
 same => n,Goto(disca)
 same => n(l4),Set(TENTOU4=1)
 same => n,Set(GROUP(tronco)=linha4)
 same => n,GotoIf($[${GROUP_COUNT(linha4@tronco)} > ${CANAIS_POR_LINHA}]?escolher)
 same => n,Set(TRONCO=brdid4)
 same => n,Set(MEUNUM=1152170714)
 same => n(disca),Set(CALLERID(num)=${MEUNUM})
 same => n,NoOp(Saindo pela linha ${MEUNUM} (${TRONCO}) — uso 3430=${USO1} 0177=${USO2} 6977=${USO3} 0714=${USO4})
 same => n,Dial(PJSIP/${NUM}@${TRONCO},60,rT)
 ; a linha morreu na hora H (qualify ainda não tinha visto)? tenta a outra
 same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL" | "${DIALSTATUS}"="CONGESTION"]?escolher)
 same => n,Hangup()
 ; Sem linha viva/livre: 503 (Congestion) em vez de 486, para o webphone
 ; diferenciar "nossas linhas indisponíveis" de "a pessoa está ocupada".
 same => n(limite),NoOp(SEM LINHA: limite=${LIMITE}, ou nenhuma linha viva/livre)
 same => n,Congestion(2)
 same => n,Hangup()

[ia-ligadora]
; A IA Ligadora atende aqui quando o cliente pega o telefone (call file).
; O áudio vai para o serviço babel-ia via AudioSocket (127.0.0.1:9092).
exten => s,1,NoOp(IA Ligadora — chamada ${IA_CHAMADA_ID})
 same => n,Answer()
 same => n,Wait(1)
 same => n,MixMonitor(/var/spool/babel/gravacoes/ia-${UNIQUEID}.wav)
 same => n,AudioSocket(${IA_CHAMADA_ID},127.0.0.1:9092)
 ; transferência a quente: se o motor gravou o ramal no AstDB, conecta o
 ; cliente direto no vendedor quando a IA sai da linha
 same => n,GotoIf($["${DB(transferir/${IA_CHAMADA_ID})}" = ""]?fim)
 same => n,NoOp(Transferência a quente → ramal ${DB(transferir/${IA_CHAMADA_ID})})
 same => n,Dial(PJSIP/${DB_DELETE(transferir/${IA_CHAMADA_ID})},30)
 same => n(fim),Hangup()

[fim-chamada]
; Hangup handler: enfileira metadados para o transcritor
exten => s,1,NoOp(Fim da chamada ${UNIQUEID})
 same => n,GotoIf($["${CDR(billsec)}"="0"]?semqos)
 same => n,Log(NOTICE,QOS ${UNIQUEID} dir=${BABEL_DIR} ramal=${BABEL_RAMAL} rtt=${CHANNEL(rtcp,rtt)} rx_perdidos=${CHANNEL(rtcp,rxploss)}/${CHANNEL(rtcp,rxcount)} tx_perdidos=${CHANNEL(rtcp,txploss)}/${CHANNEL(rtcp,txcount)} jitter_rx=${CHANNEL(rtcp,rxjitter)} jitter_tx=${CHANNEL(rtcp,txjitter)})
 same => n(semqos),Set(PEER=${CUT(DIALEDPEERNAME,-,1)})
 same => n,Set(PEER_RAMAL=${CUT(PEER,/,2)})
 same => n,Set(RAMAL_FINAL=${IF($["${BABEL_DIR}"="saida"]?${BABEL_RAMAL}:${PEER_RAMAL})})
 same => n,System(/opt/babel/fim_chamada.sh "${UNIQUEID}" "${BABEL_DIR}" "${BABEL_NUM}" "${RAMAL_FINAL}" "${CDR(start)}" "${CDR(answer)}" "${CDR(end)}" "${CDR(billsec)}" "${CDR(disposition)}")
 same => n,System(rm -f /var/spool/babel/aovivo/${UNIQUEID})
 same => n,Return()
